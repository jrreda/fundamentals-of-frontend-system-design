<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Frontend System Design Fundamentals</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <main id="container"></main>
  </body>
  <script>
    const container = document.getElementById("container");
    const html = `<article class="card">
    <h3 class="card__title"></h3>
    <div class="card__body">
      <div class='card__body__image'></div>
      <section class='card__body__content'>
      </section>
    </div>
  </article>`;

    /**
     * @param {string} title
     * @param {string} body
     *
     * @return {HTMLElement
     */
    function createCardComponent(title, body) {
      // 1. Parse the HTML string into a document
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, "text/html");

      // 2. Select card
      const card_title = doc.querySelector(".card__title");
      const card_body = doc.querySelector(".card__body__content");

      // 3. Set values
      card_title.textContent = title;
      card_body.textContent = body;

      // 4. return the Card
      return doc.querySelector(".card");
    }

    const component = createCardComponent(
      "Frontend System Design: Fundamentals",
      "This is a random body text",
    );

    container.appendChild(component);
  </script>
</html>
