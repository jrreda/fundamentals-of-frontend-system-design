<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Frontend System Design Fundamentals</title>
    <link rel="stylesheet" href="./index.css" />

    <!-- Document Fragment (lightweight in-memory HTML representation) -->
    <template id="card_template">
      <article class="card">
        <h3 class="card__title"></h3>
        <div class="card__body">
          <div class="card__body__image"></div>
          <section class="card__body__content"></section>
        </div>
      </article>
    </template>
  </head>

  <body>
    <main id="container"></main>
  </body>

  <script>
    const container = document.getElementById("container");

    /**
     * @param {string} title
     * @param {string} body
     *
     * @return {HTMLElement}
     */
    function createCardComponent(title, body) {
      // 1. Get Html card from template
      const template = document.getElementById("card_template");
      const card = template.content.cloneNode(true).firstElementChild;

      // 2. Select title & body
      const cardTitle = card.querySelector(".card__title");
      const cardBody = card.querySelector(".card__body__content");

      // 3. Update title & body content
      cardTitle.textContent = title;
      cardBody.textContent = body;

      // 4. Return the card element
      return card;
    }

    const component = createCardComponent(
      "Frontend System Design: Fundamentals",
      "This is a random body text",
    );

    container.appendChild(component);
  </script>
</html>
